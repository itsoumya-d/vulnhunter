name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff pytest

      - name: Lint (ruff)
        run: ruff check --select E9,F backend/

      - name: Test
        run: PYTHONPATH=. pytest backend/ -q

  docker:
    name: Docker build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vulnhunter:ci .

      - name: Boot container and check /health
        run: |
          docker run -d --name vulnhunter -p 8000:8000 vulnhunter:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "container healthy"
              exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy"
          docker logs vulnhunter
          exit 1
